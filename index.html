<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawson OS Desktop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #111; color: #fff; height: 100vh; overflow: hidden; position: relative; }
        
        /* Taskbar pinned to bottom */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45px;
            background: rgba(22, 22, 26, 0.95);
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
        }

        .start-btn {
            background: #f96332;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-menu {
            display: none;
            position: absolute;
            bottom: 55px;
            left: 15px;
            width: 250px;
            background: #1a1a20;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            z-index: 1001;
        }

        .start-menu.active { display: block; }
        .menu-item { padding: 8px; margin-top: 5px; background: #2a2a30; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Taskbar and Start Button HTML -->
    <div class="taskbar">
        <button class="start-btn" onclick="toggleStartMenu()">⚡ Dawson OS</button>
        <div id="clock">00:00</div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
        <h3>Applications</h3>
        <div class="menu-item" onclick="alert('Opening Web Links')">📁 Web Links</div>
        <div class="menu-item" onclick="alert('Opening Games')">🎮 Game Center</div>
    </div>

    <script>
        function toggleStartMenu() {
            document.getElementById('startMenu').classList.toggle('active');
        }
        setInterval(() => { 
            document.getElementById('clock').innerText = new Date().toLocaleTimeString(); 
        }, 1000);
    </script>
</body>
</html>
