<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawson OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #16161a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #23232a;
        }

        header h1 {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 600;
        }

        #clock {
            color: #888899;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            height: calc(100vh - 50px);
        }

        .sidebar {
            width: 220px;
            background-color: #16161a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #23232a;
        }

        .sidebar h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666677;
            margin-bottom: 5px;
        }

        .app-btn {
            background-color: #1f1f24;
            color: #dddde8;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2d2d35;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .app-btn:hover {
            background-color: #2a2a32;
            color: #ffffff;
        }

        .viewport {
            flex: 1;
            background-color: #121215;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #23232a;
        }

        .app-screen {
            display: none;
            width: 100%;
            height: 100%;
        }

        .active {
            display: flex !important;
        }

        /* --- Serum Browser Start Page --- */
        #browser-app {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #121215;
            padding: 20px;
        }

        .browser-logo {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .browser-logo span {
            color: #f96332;
        }

        .search-box {
            width: 100%;
            max-width: 650px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: #777788;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border-radius: 30px;
            border: 1px solid #2a2a35;
            background-color: #1a1a20;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .search-input:focus {
            border-color: #444455;
            background-color: #1f1f28;
        }

        .search-input::placeholder {
            color: #555566;
        }

        /* --- Tic Tac Toe --- */
        #tictactoe-app {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 8px;
        }

        .cell {
            width: 90px;
            height: 90px;
            background-color: #1a1a20;
            border: 1px solid #2d2d35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            color: #f96332;
        }

        .cell:hover {
            background-color: #24242e;
        }

        .reset-btn {
            padding: 8px 18px;
            background-color: #f96332;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dawson OS</h1>
        <div id="clock">00:00:00</div>
    </header>

    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <h2>Applications</h2>
            <button class="app-btn" onclick="openApp('browser')">🌐 Browser</button>
            <button class="app-btn" onclick="openApp('tictactoe')">❌ Tic-Tac-Toe</button>
        </div>

        <!-- Main Display Area -->
        <div class="viewport">
            
            <!-- Custom Serum Browser Screen -->
            <div id="browser-app" class="app-screen active">
                <div class="browser-logo">Serum<span>•</span>Browser</div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search or paste a URL" onkeydown="handleSearch(event)">
                </div>
            </div>

            <!-- Tic-Tac-Toe App Screen -->
            <div id="tictactoe-app" class="app-screen">
                <h3 id="status">Player X's Turn</h3>
                <div class="board">
                    <div class="cell" onclick="makeMove(this, 0)"></div>
                    <div class="cell" onclick="makeMove(this, 1)"></div>
                    <div class="cell" onclick="makeMove(this, 2)"></div>
                    <div class="cell" onclick="makeMove(this, 3)"></div>
                    <div class="cell" onclick="makeMove(this, 4)"></div>
                    <div class="cell" onclick="makeMove(this, 5)"></div>
                    <div class="cell" onclick="makeMove(this, 6)"></div>
                    <div class="cell" onclick="makeMove(this, 7)"></div>
                    <div class="cell" onclick="makeMove(this, 8)"></div>
                </div>
                <button class="reset-btn" onclick="resetGame()">Restart Game</button>
            </div>

        </div>
    </div>

    <script>
        // Real-time Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Switch active app
        function openApp(appName) {
            document.querySelectorAll('.app-screen').forEach(app => app.classList.remove('active'));
            document.getElementById(appName + '-app').classList.add('active');
        }

        // Search bar handler (Opens search safely in a new tab to bypass iframe security blocks)
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                if (query) {
                    if (query.startsWith('http://') || query.startsWith('https://')) {
                        window.open(query, '_blank');
                    } else {
                        window.open('https://duckduckgo.com/?q=' + encodeURIComponent(query), '_blank');
                    }
                }
            }
        }

        // Tic Tac Toe Game Logic
        let currentPlayer = 'X';
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        const winningCombos = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function makeMove(cell, index) {
            if (boardState[index] !== '' || !gameActive) return;

            boardState[index] = currentPlayer;
            cell.innerText = currentPlayer;

            if (checkWin()) {
                document.getElementById('status').innerText = `Player ${currentPlayer} Wins!`;
                gameActive = false;
                return;
            }

            if (!boardState.includes('')) {
                document.getElementById('status').innerText = "It's a Draw!";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('status').innerText = `Player ${currentPlayer}'s Turn`;
        }

        function checkWin() {
            return winningCombos.some(combo => {
                return combo.every(index => boardState[index] === currentPlayer);
            });
        }

        function resetGame() {
            boardState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            document.getElementById('status').innerText = "Player X's Turn";
            document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
        }
    </script>

</body>
</html>
