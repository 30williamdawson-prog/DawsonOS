<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawson OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b1b24 0%, #0d0d11 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #23232a;
        }

        header h1 {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #clock {
            color: #888899;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            height: calc(100vh - 50px);
        }

        .sidebar {
            width: 220px;
            background-color: #16161a;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #23232a;
        }

        .sidebar h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #666677;
            margin-bottom: 5px;
        }

        .app-btn {
            background-color: #1f1f24;
            color: #dddde8;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #2d2d35;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-btn:hover {
            background-color: #f96332;
            color: #ffffff;
            border-color: #f96332;
            transform: translateX(3px);
        }

        .viewport {
            flex: 1;
            background-color: #121215;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #23232a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .app-screen {
            display: none;
            width: 100%;
            height: 100%;
        }

        .active {
            display: flex !important;
        }

        /* --- Dawson OS Search Home Screen --- */
        #browser-app {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #121215;
            padding: 20px;
        }

        .browser-logo {
            font-size: 3.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .browser-logo span {
            color: #f96332;
        }

        .search-box {
            width: 100%;
            max-width: 650px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: #777788;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border-radius: 30px;
            border: 1px solid #2a2a35;
            background-color: #1a1a20;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: #f96332;
            background-color: #1f1f28;
            box-shadow: 0 0 15px rgba(249, 99, 50, 0.2);
        }

        .search-input::placeholder {
            color: #555566;
        }

        /* --- Tic Tac Toe --- */
        #tictactoe-app {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 8px;
        }

        .cell {
            width: 90px;
            height: 90px;
            background-color: #1a1a20;
            border: 1px solid #2d2d35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            color: #f96332;
            transition: background 0.2s;
        }

        .cell:hover {
            background-color: #24242e;
        }

        /* --- Calculator App --- */
        #calculator-app {
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .calc-body {
            background-color: #1a1a20;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2d2d35;
            width: 260px;
        }

        #calcDisplay {
            width: 100%;
            height: 50px;
            background-color: #121215;
            border: 1px solid #2d2d35;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.4rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            outline: none;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-btn {
            padding: 15px;
            background-color: #24242e;
            color: #ffffff;
            border: 1px solid #2d2d35;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background-color: #323240;
        }

        .calc-btn.op {
            background-color: #f96332;
            border-color: #f96332;
        }

        /* --- Notes App --- */
        #notes-app {
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        #notesArea {
            width: 100%;
            height: 100%;
            background-color: #1a1a20;
            border: 1px solid #2d2d35;
            border-radius: 8px;
            padding: 15px;
            color: #ffffff;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        #notesArea:focus {
            border-color: #f96332;
        }

        .reset-btn {
            padding: 10px 20px;
            background-color: #f96332;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dawson OS</h1>
        <div id="clock">00:00:00</div>
    </header>

    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <h2>Applications</h2>
            <button class="app-btn" onclick="openApp('browser')">🌐 Search Bar</button>
            <button class="app-btn" onclick="openApp('tictactoe')">❌ Tic-Tac-Toe</button>
            <button class="app-btn" onclick="openApp('calculator')">🧮 Calculator</button>
            <button class="app-btn" onclick="openApp('notes')">📝 Quick Notes</button>
        </div>

        <!-- Main Display Area -->
        <div class="viewport">
            
            <!-- Dawson OS Search Screen -->
            <div id="browser-app" class="app-screen active">
                <div class="browser-logo">Dawson<span>•</span>OS</div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search or paste a URL" onkeydown="handleSearch(event)">
                </div>
            </div>

            <!-- Tic-Tac-Toe App Screen -->
            <div id="tictactoe-app" class="app-screen">
                <h3 id="status" style="margin-bottom: 10px;">Player X's Turn</h3>
                <div class="board">
                    <div class="cell" onclick="makeMove(this, 0)"></div>
                    <div class="cell" onclick="makeMove(this, 1)"></div>
                    <div class="cell" onclick="makeMove(this, 2)"></div>
                    <div class="cell" onclick="makeMove(this, 3)"></div>
                    <div class="cell" onclick="makeMove(this, 4)"></div>
                    <div class="cell" onclick="makeMove(this, 5)"></div>
                    <div class="cell" onclick="makeMove(this, 6)"></div>
                    <div class="cell" onclick="makeMove(this, 7)"></div>
                    <div class="cell" onclick="makeMove(this, 8)"></div>
                </div>
                <button class="reset-btn" onclick="resetGame()" style="margin-top: 15px;">Restart Game</button>
            </div>

            <!-- Calculator App Screen -->
            <div id="calculator-app" class="app-screen">
                <div class="calc-body">
                    <input type="text" id="calcDisplay" readonly placeholder="0">
                    <div class="calc-grid">
                        <button class="calc-btn" onclick="clearCalc()">C</button>
                        <button class="calc-btn" onclick="appendCalc('/')">/</button>
                        <button class="calc-btn" onclick="appendCalc('*')">*</button>
                        <button class="calc-btn op" onclick="appendCalc('-')">-</button>
                        
                        <button class="calc-btn" onclick="appendCalc('7')">7</button>
                        <button class="calc-btn" onclick="appendCalc('8')">8</button>
                        <button class="calc-btn" onclick="appendCalc('9')">9</button>
                        <button class="calc-btn op" onclick="appendCalc('+')">+</button>
                        
                        <button class="calc-btn" onclick="appendCalc('4')">4</button>
                        <button class="calc-btn" onclick="appendCalc('5')">5</button>
                        <button class="calc-btn" onclick="appendCalc('6')">6</button>
                        <button class="calc-btn op" onclick="solveCalc()">=</button>
                        
                        <button class="calc-btn" onclick="appendCalc('1')">1</button>
                        <button class="calc-btn" onclick="appendCalc('2')">2</button>
                        <button class="calc-btn" onclick="appendCalc('3')">3</button>
                        <button class="calc-btn" onclick="appendCalc('0')">0</button>
                    </div>
                </div>
            </div>

            <!-- Notes App Screen -->
            <div id="notes-app" class="app-screen">
                <h2>Quick Notepad</h2>
                <textarea id="notesArea" placeholder="Type your notes here... (They save automatically!)" oninput="saveNotes()"></textarea>
            </div>

        </div>
    </div>

    <script>
        // Real-time Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Switch active app
        function openApp(appName) {
            document.querySelectorAll('.app-screen').forEach(app => app.classList.remove('active'));
            document.getElementById(appName + '-app').classList.add('active');
        }

        // Search bar handler
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                if (query) {
                    if (query.startsWith('http://') || query.startsWith('https://')) {
                        window.open(query, '_blank');
                    } else {
                        window.open('https://duckduckgo.com/?q=' + encodeURIComponent(query), '_blank');
                    }
                }
            }
        }

        // Tic Tac Toe Logic
        let currentPlayer = 'X';
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        const winningCombos = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function makeMove(cell, index) {
            if (boardState[index] !== '' || !gameActive) return;

            boardState[index] = currentPlayer;
            cell.innerText = currentPlayer;

            if (checkWin()) {
                document.getElementById('status').innerText = `Player ${currentPlayer} Wins!`;
                gameActive = false;
                return;
            }

            if (!boardState.includes('')) {
                document.getElementById('status').innerText = "It's a Draw!";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('status').innerText = `Player ${currentPlayer}'s Turn`;
        }

        function checkWin() {
            return winningCombos.some(combo => {
                return combo.every(index => boardState[index] === currentPlayer);
            });
        }

        function resetGame() {
            boardState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            document.getElementById('status').innerText = "Player X's Turn";
            document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
        }

        // Calculator Logic
        function appendCalc(val) {
            document.getElementById('calcDisplay').value += val;
        }
        function clearCalc() {
            document.getElementById('calcDisplay').value = '';
        }
        function solveCalc() {
            try {
                document.getElementById('calcDisplay').value = eval(document.getElementById('calcDisplay').value);
            } catch {
                document.getElementById('calcDisplay').value = 'Error';
            }
        }

        // Notes Auto-save Logic
        document.getElementById('notesArea').value = localStorage.getItem('dawson_os_notes') || '';
        function saveNotes() {
            localStorage.setItem('dawson_os_notes', document.getElementById('notesArea').value);
        }
    </script>

</body>
</html>
</html>
