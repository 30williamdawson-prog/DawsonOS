<script>
    // Clock
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

    // Window & Menu Controls
    function toggleStartMenu() {
        document.getElementById('startMenu').classList.toggle('active');
    }

    function openWindow(id) {
        document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function closeWindow(id) {
        document.getElementById(id).classList.remove('active');
    }

    function switchGame(tabId) {
        document.querySelectorAll('.game-tab').forEach(t => t.style.display = 'none');
        document.getElementById(tabId).style.display = 'block';
    }

    // DuckDuckGo Bypass Launcher
    function launchViaDDG(query) {
        // Uses DuckDuckGo's backslash operator to automatically forward to the top result
        const targetUrl = 'https://duckduckgo.com/?q=\\' + encodeURIComponent(query);
        window.open(targetUrl, '_blank');
    }

    // Update HTML onclick handlers dynamically for external links
    document.addEventListener("DOMContentLoaded", () => {
        const cards = document.querySelectorAll('#links-win .card');
        cards.forEach(card => {
            const title = card.querySelector('strong').innerText;
            card.onclick = () => launchViaDDG(title);
        });
    });

    // Responsive Dawson AI Logic
    function sendAiMessage(e) {
        if (e.key === 'Enter') {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="chat-msg user-msg">${msg}</div>`;
            input.value = '';

            setTimeout(() => {
                const lower = msg.toLowerCase();
                let reply = "";

                if (lower.includes("i love you")) {
                    reply = "I appreciate that! Dawson OS is happy to have you here. ❤️";
                } else if (lower.includes("i own you")) {
                    reply = "Indeed! You are the administrator of Dawson OS.";
                } else if (lower.includes("hello") || lower.includes("hi") || lower.includes("hey")) {
                    reply = "Greetings! What are we testing out today?";
                } else {
                    const responses = [
                        `Got it! Regarding "${msg}", how can I help?`,
                        "All systems operating smoothly on Dawson OS.",
                        "Command acknowledged!"
                    ];
                    reply = responses[Math.floor(Math.random() * responses.length)];
                }

                chatBox.innerHTML += `<div class="chat-msg ai-msg">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 300);
        }
    }

    // Tic Tac Toe Game
    let currentPlayer = 'X', boardState = ['', '', '', '', '', '', '', '', ''], gameActive = true;
    const winningCombos = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function makeMove(cell, index) {
        if (boardState[index] !== '' || !gameActive) return;
        boardState[index] = currentPlayer; cell.innerText = currentPlayer;
        if (winningCombos.some(c => c.every(i => boardState[i] === currentPlayer))) {
            document.getElementById('status').innerText = `Player ${currentPlayer} Wins!`; gameActive = false; return;
        }
        if (!boardState.includes('')) { document.getElementById('status').innerText = "It's a Draw!"; gameActive = false; return; }
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        document.getElementById('status').innerText = `Player ${currentPlayer}'s Turn`;
    }
    function resetGame() {
        boardState = ['', '', '', '', '', '', '', '', '']; gameActive = true; currentPlayer = 'X';
        document.getElementById('status').innerText = "Player X's Turn";
        document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
    }

    // Snake Game
    function startSnake() {
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        let snake = [{x: 140, y: 100}], food = {x: 60, y: 60}, dx = 20, dy = 0;
        document.onkeydown = (e) => {
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -20; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 20; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -20; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 20; dy = 0; }
        };
        let game = setInterval(() => {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if(head.x < 0 || head.x >= 280 || head.y < 0 || head.y >= 220) { clearInterval(game); alert('Game Over!'); return; }
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                food = {x: Math.floor(Math.random()*14)*20, y: Math.floor(Math.random()*10)*20};
            } else { snake.pop(); }
            ctx.fillStyle = '#1a1a20'; ctx.fillRect(0, 0, 280, 220);
            ctx.fillStyle = '#f96332'; ctx.fillRect(food.x, food.y, 18, 18);
            ctx.fillStyle = '#ffffff'; snake.forEach(part => ctx.fillRect(part.x, part.y, 18, 18));
        }, 130);
    }

    // Notes
    document.getElementById('notesArea').value = localStorage.getItem('dawson_os_notes') || '';
    function saveNotes() { localStorage.setItem('dawson_os_notes', document.getElementById('notesArea').value); }
</script>
